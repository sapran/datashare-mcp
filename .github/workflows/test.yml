name: test

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Least privilege. This job comments on nothing, uploads nothing and pushes nothing, so a
# read-only token is the whole of what it needs. It does execute the full third-party
# dependency tree — `uv sync --all-extras` runs build backends, `uv run pytest` imports
# and runs the result — and the `push:` trigger above is not covered by GitHub's forced
# read-only token for fork pull requests.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      # Pinned to full commit SHAs: a tag is mutable and a branch ref is force-pushable,
      # so `@v4` is a promise from whoever controls the upstream ref, and this job runs
      # their code. The trailing comment is the human-readable version; dependabot.yml
      # rewrites the SHA and the comment together.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Otherwise the token lands in .git/config, readable by every dependency this
          # job then installs and executes. The tests need the tree, not the token.
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Lint
        run: uv run ruff check .

      - name: Type check
        run: uv run mypy

      - name: Run tests
        run: uv run pytest -q

      # Every install of this project builds the sdist from git — there is no published
      # wheel — so packaging is on the path of every user, not just of a release. Without
      # this step, moving a module out of src/datashare_mcp or breaking
      # [tool.hatch.build.targets.wheel] passes CI green and fails on every fresh install
      # and every cold uv cache.
      - name: Build
        run: uv build
