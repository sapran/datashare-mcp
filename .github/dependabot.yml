version: 2

updates:
  # Workflows pin every `uses:` to a commit SHA, which is safe but goes stale silently.
  # Dependabot rewrites the SHA and the trailing version comment together, so the pin
  # stays current without anyone hand-resolving refs.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
