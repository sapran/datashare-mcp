# Local ICIJ Datashare for developing and testing datashare-mcp.
#
# This deploys the SERVER UNDER TEST, not the MCP server in this repository. The MCP
# server runs on the host as a stdio subprocess of your MCP client; see README.md.
#
# It is designed to run ALONGSIDE the local Aleph stack, which holds ports 8080, 9200 and
# 5000. Datashare is published on 8888 and its Elasticsearch on 9201. Only the host
# mapping moves — the containers still listen on 8080 and 9200 internally.
#
#   docker compose up -d          start
#   docker compose ps             status
#   docker compose logs -f app    follow the server log
#   docker compose down           stop and remove containers, KEEPING the data
#
# The two data volumes are `external`, so NO compose command can delete them, `down -v`
# included. Only `docker volume rm` and `docker ... prune` can. See the `volumes:` block.
#
# Full runbook: docs/local-environment.md

name: datashare

services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.19.8
    # As on the Aleph stack. Also covers the case where Docker Desktop restarts and
    # leaves every container without a policy stopped — observed on this machine.
    restart: on-failure
    # A cgroup ceiling on top of the heap, so that when this VM runs out of memory the
    # kernel kills the container that exceeded its own budget instead of an arbitrary
    # neighbour. Exit 137 on this container then means this container, legibly.
    #
    # The heap must leave room *inside* this ceiling for the JVM's off-heap use — Lucene
    # mmap accounting, direct buffers, metaspace, thread stacks. A 2 GB heap under a 3 GB
    # limit did not: the container sat at ~2.2 GB steady and was OOM-killed on every GC
    # spike (observed: RestartCount 39, exit 137 in a loop). Raising the limit is not
    # available — the sibling Aleph stack's ingest workers hold ~11 GB of this VM's
    # 17.5 GB — so the heap comes down to fit the budget instead. This index is small
    # (single-digit thousands of documents); 1 GB is ample.
    mem_limit: 3g
    ports:
      # Loopback only, as the sibling Aleph stack binds every published port. This
      # Elasticsearch runs with xpack.security.enabled=false, so anything that can reach
      # the port has unauthenticated read and write access to the index.
      - "127.0.0.1:9201:9200"
    environment:
      # Carried over unchanged from the original deployment, not tuned. The existing
      # index was created under these watermarks, and flood_stage=100% means Elasticsearch
      # will not go read-only until the disk is completely full — keep real headroom on
      # the host rather than relaxing anything here.
      ES_JAVA_OPTS: "-Xms1g -Xmx1g"
      discovery.type: single-node
      cluster.name: datashare
      cluster.routing.allocation.disk.watermark.low: "90%"
      cluster.routing.allocation.disk.watermark.high: "99%"
      cluster.routing.allocation.disk.watermark.flood_stage: "100%"
      xpack.security.enabled: "false"
      indices.id_field_data.enabled: "true"
      # Defence in depth behind the MCP server's body guard (client.py `_scan_body`).
      #
      # NOT `script.allowed_types: none` — measured, not assumed: Datashare's ranged
      # content endpoint issues an inline Painless substring, so refusing inline scripts
      # outright breaks get_document_content with "all shards failed" (58 × "cannot
      # execute [inline] scripts" in this node's log).
      #
      # Restricting the *context* keeps that working while still refusing the shapes a
      # caller-supplied query would use: `field` is what Datashare's substring needs;
      # `aggs` (scripted_metric) and `score` (script_score, function_score) are not
      # granted, so those are refused by the node even if the client guard is bypassed.
      #
      # Not covered, and worth knowing before anyone relaxes the client guard on the
      # strength of this: `script_fields` and a search-body `runtime_mappings` script both
      # run in the `field` context too, so this setting cannot refuse them without also
      # breaking get_document_content. `_scan_body` is the only control on those two.
      script.allowed_contexts: "field"
    volumes:
      - es-data:/usr/share/elasticsearch/data
    healthcheck:
      # `app` waits on this. Without it the two containers start together, the app's JVM
      # caches the failed DNS lookup for `elasticsearch`, and every /api/index/... call
      # answers HTTP 500 with UnknownHostException until the app is restarted by hand.
      #
      # `wait_for_status=yellow` matters: a bare /_cluster/health answers 200 whatever the
      # colour, so a RED cluster (tenderchad unassigned or corrupt) would report healthy
      # and the app would start against an unusable index. A single-node cluster never
      # reaches green — it has no replicas — so yellow is the correct bar.
      test:
        - CMD-SHELL
        - curl -sf 'localhost:9200/_cluster/health?wait_for_status=yellow&timeout=1s' || exit 1
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  app:
    image: icij/datashare:21.2.1-ui
    # This image exists only on this machine: it was built from a source tree that no
    # longer exists locally and is archived at ~/backups/icij-datashare-21.2.1-ui.tar.gz.
    # `icij/datashare` is also a public Docker Hub repository, so without this a lost
    # local image would be silently replaced by whatever that tag resolves to upstream —
    # a different build, run against volumes only 21.2.1 should touch. Fail instead, and
    # recover with `docker load -i`.
    pull_policy: never
    restart: on-failure
    mem_limit: 3g
    depends_on:
      elasticsearch:
        condition: service_healthy
    ports:
      # Loopback only. LOCAL mode does NOT enforce API-key authentication — it binds only
      # CsrfFilter and LocalUserFilter, never ApiKeyFilter — so anything that can reach
      # this port has full read AND write access to the corpus, key or no key. Publishing
      # it on 0.0.0.0 would expose that to every network the laptop joins.
      - "127.0.0.1:8888:8080"
    environment:
      DATASHARE_SYNC_NLP_MODELS: "false"
      DS_JAVA_OPTS: "-Xmx2g"
    volumes:
      - dist:/home/datashare/dist
      # Long syntax for create_host_path: false. The short form conjures a missing source
      # directory as an empty one, which would start a healthy-looking instance serving
      # nothing. `:?` above catches an unset variable; this catches a wrong one.
      - type: bind
        source: ${DATASHARE_DATA_DIR:?set DATASHARE_DATA_DIR in .env — see docs/local-environment.md}
        target: /home/datashare/data
        read_only: true
        bind:
          create_host_path: false
    # `--bind 0.0.0.0` is REQUIRED: LOCAL mode otherwise binds localhost-only inside the
    # container, which the port mapping cannot reach.
    command:
      - --mode=LOCAL
      - --bind=0.0.0.0
      - --dataDir=/home/datashare/data
      - --defaultProject=tenderchad
      - --elasticsearchAddress=http://elasticsearch:9200

  # --- one-shot operations, not started by `up` --------------------------------
  #
  # Both share the app's volumes and must not run while `app` is up: two processes must
  # never write the same SQLite file. Stop it first with `docker compose stop app`.
  #
  # Always invoke them as `--profile tools run --rm <service>`. Two ways to get this
  # wrong, neither of which anything here can prevent:
  #   * `--profile tools up` starts BOTH as long-running services next to a live app.
  #   * COMPOSE_PROFILES=tools in .env arms the profile for every later command,
  #     including a plain `docker compose up -d`. Never set it there.
  # Either mints an unrequested API key, invalidating the one in the Keychain, and starts
  # a full re-index against a live SQLite.

  ingest:
    # docker compose --profile tools run --rm ingest
    #
    # Re-ingests the corpus. Only needed if the index is lost. The CLI JVM may hang after
    # "exiting main"; once "drained N documents" appears it is done, Ctrl-C it.
    # The plain icij/datashare:21.2.1 tag is no longer on this machine; -ui is a superset
    # and runs CLI mode identically.
    profiles: ["tools"]
    image: icij/datashare:21.2.1-ui
    pull_policy: never
    depends_on:
      elasticsearch:
        condition: service_healthy
    environment:
      DATASHARE_SYNC_NLP_MODELS: "false"
      DS_JAVA_OPTS: "-Xmx3g"
    volumes:
      - dist:/home/datashare/dist
      # Same create_host_path: false as `app` — an ingest that silently indexes an empty
      # auto-created directory is the worst possible outcome here.
      - type: bind
        source: ${DATASHARE_DATA_DIR:?set DATASHARE_DATA_DIR in .env — see docs/local-environment.md}
        target: /home/datashare/data
        read_only: true
        bind:
          create_host_path: false
    command:
      - --mode=CLI
      - --dataDir=/home/datashare/data
      - --defaultProject=tenderchad
      - --stages=SCAN,INDEX
      - --elasticsearchAddress=http://elasticsearch:9200

  apikey:
    # docker compose --profile tools run --rm apikey
    #
    # Mints a fresh API key; Datashare cannot retrieve an existing one. Look for
    # "generated secret key for user local ...: <KEY>" and put it in the login Keychain:
    #   security add-generic-password -U -a "$USER" -s datashare-mcp -w
    #
    # The key is printed in CLEARTEXT. Keep `--rm` so no container log retains it, clear
    # the scrollback afterwards, and never paste the output into an issue or a screenshot.
    profiles: ["tools"]
    image: icij/datashare:21.2.1-ui
    pull_policy: never
    depends_on:
      elasticsearch:
        condition: service_healthy
    volumes:
      - dist:/home/datashare/dist
    command:
      - --mode=CLI
      - --createApiKey=local
      - --elasticsearchAddress=http://elasticsearch:9200

volumes:
  # `name:` is load-bearing. Compose otherwise prefixes volumes with the project name and
  # would create empty `datashare_es-data` / `datashare_dist`, presenting an instance with
  # no projects and no documents while the real data sat untouched under the old names.
  #
  # `external: true` is the other half. These two volumes are the only copy of the
  # 4884-document `tenderchad` index and of the SQLite project rows and API-key hash, and
  # rebuilding them means a full re-ingest. Declaring them external puts them outside this
  # project's lifecycle, so `docker compose down -v` — a single stray flag on the ordinary
  # teardown command — cannot delete them. Under the `docker run` setup this file replaces,
  # no compose command could reach them at all; external keeps that property.
  #
  # The cost is one command on a machine that has never run this stack:
  #
  #   docker volume create datashare-es-data
  #   docker volume create datashare-dist
  #
  # Without them `up` fails with `external volume "datashare-es-data" not found`, which is
  # a far better first run than silently starting an empty instance.
  es-data:
    external: true
    name: datashare-es-data
  dist:
    external: true
    name: datashare-dist
